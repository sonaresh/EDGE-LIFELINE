apiVersion: v1
kind: Namespace
metadata:
  name: edge-lifeline
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: edge-lifeline
  namespace: edge-lifeline
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-lifeline
  namespace: edge-lifeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edge-lifeline
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge-lifeline
    spec:
      serviceAccountName: edge-lifeline
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runtime
          image: edge-lifeline:phase7
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: EDGE_LIFELINE_NODE_ID
              valueFrom:
                configMapKeyRef:
                  name: edge-lifeline-node
                  key: node_id
            - name: EDGE_LIFELINE_NODE_ROLE
              valueFrom:
                configMapKeyRef:
                  name: edge-lifeline-node
                  key: node_role
            - name: EDGE_LIFELINE_ENVIRONMENT
              value: phase7-research
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 250m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: edge-lifeline
  namespace: edge-lifeline
spec:
  selector:
    app.kubernetes.io/name: edge-lifeline
  ports:
    - name: http
      port: 8080
      targetPort: http
