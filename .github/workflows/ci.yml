name: phase1-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8
        with:
          version: "0.11.33"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run Phase 1 gate
        shell: pwsh
        run: |
          ./scripts/run_phase_gate.ps1 -CiRunUrl "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase1-validation-evidence
          path: evidence/phase1/generated/
          if-no-files-found: warn
